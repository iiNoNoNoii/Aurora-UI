# Aurora UI – copy/paste configuration examples.
# Examples 1-9 configure Aurora Background (add ONE per view).
# Examples 10+ are the Aurora Cards.

# ---------------------------------------------------------------------------
# 1. The absolute minimum.
#    Aurora picks the first weather.* entity it finds and uses sun.sun.
# ---------------------------------------------------------------------------
- type: custom:aurora-background

# ---------------------------------------------------------------------------
# 2. Recommended starting point.
# ---------------------------------------------------------------------------
- type: custom:aurora-background
  weather_entity: weather.home
  quality: auto

# ---------------------------------------------------------------------------
# 3. Debugging – shows FPS, quality, sun elevation, weather state, particles.
# ---------------------------------------------------------------------------
- type: custom:aurora-background
  weather_entity: weather.home
  quality: high
  debug: true

# ---------------------------------------------------------------------------
# 4. Everything spelled out. All values below are the defaults.
# ---------------------------------------------------------------------------
- type: custom:aurora-background
  mode: background # background | card
  weather_entity: weather.home
  sun_entity: sun.sun
  quality: auto # auto | low | medium | high | ultra
  debug: false

  # These are permissions, not switches: rain only shows up when the weather
  # entity actually reports rain. Set one to false to rule it out entirely.
  effects:
    sun: true
    moon: true
    stars: true
    shooting_stars: true
    clouds: true
    rain: true
    snow: true
    fog: true
    lightning: true
    constellations: true # real named stars, joined into the figures
    milky_way: true # the galactic band, on dark clear nights
    sun_rays: true # crepuscular rays through gaps in the cloud
    season: true # subtle seasonal colour cast and haze
    parallax: true # layers drift with scrolling and pointer movement

  appearance:
    intensity: 1.0 # 0..2 – particle and cloud density
    saturation: 1.0 # 0..2
    brightness: 1.0 # 0.2..2
    blur: 0 # px – soften the whole layer
    ambient_glow: 1.0 # 0..2 – sun/moon halos
    opacity: 1.0 # 0..1 – fade the layer against the theme

  performance:
    max_fps: 60 # 10..120
    auto_quality: true # scale back if frames get expensive
    pause_when_hidden: true # stop rendering when the tab is in the background

  glass:
    enabled: false # opt-in: restyles every card on the dashboard
    preset: glass # glass | frosted | tinted | outline | minimal | plain
    # preset_entity: input_select.dashboard_style   # switch it live, see #19
    blur: 14 # explicit values beat the preset they came from
    opacity: 0.45
    saturate: 1.4
    border: true
    glow: 0.8
    radius: 18 # -1 keeps your theme's
    adaptive_text: false # also drive --primary-text-color

  background:
    transparent_lovelace: true # make the dashboard surface see-through
    header: auto # auto | glass | transparent | keep
    z_index: -1 # keep the layer behind every card
    ambient_variables: true # publish --aurora-* colours for themes and cards
    css_variables: {} # escape hatch, see below

# ---------------------------------------------------------------------------
# 5. A theme that paints its own background over Aurora?
#    Force the offending variables to transparent here.
# ---------------------------------------------------------------------------
- type: custom:aurora-background
  weather_entity: weather.home
  background:
    css_variables:
      primary-background-color: transparent
      card-background-color: rgba(30, 34, 46, 0.55)

# ---------------------------------------------------------------------------
# 6. Battery/wallpanel friendly.
# ---------------------------------------------------------------------------
- type: custom:aurora-background
  weather_entity: weather.home
  quality: low
  effects:
    shooting_stars: false
  performance:
    max_fps: 24
    auto_quality: false

# ---------------------------------------------------------------------------
# 7. Normal card instead of a dashboard background.
# ---------------------------------------------------------------------------
- type: custom:aurora-background
  mode: card
  height: 260px
  weather_entity: weather.home
  quality: high

# ---------------------------------------------------------------------------
# 8. Aurora Glass: the full look, in three lines.
# ---------------------------------------------------------------------------
- type: custom:aurora-background
  weather_entity: weather.home
  glass: true

# ---------------------------------------------------------------------------
# 9. Calm sky, strong glass. Good over a busy dashboard.
# ---------------------------------------------------------------------------
- type: custom:aurora-background
  weather_entity: weather.home
  appearance:
    intensity: 0.6
    brightness: 0.85
  effects:
    shooting_stars: false
    lightning: false
  glass:
    enabled: true
    opacity: 0.62
    blur: 20
    glow: 0.5

# ---------------------------------------------------------------------------
# 9b. Switch the whole dashboard's style from a dropdown, live.
#
#     configuration.yaml:
#       input_select:
#         dashboard_style:
#           name: Dashboard style
#           options: [glass, frosted, tinted, outline, minimal, plain]
#           initial: glass
#
#     Then put an entities card with input_select.dashboard_style on the
#     dashboard. "plain" doubles as the off switch.
# ---------------------------------------------------------------------------
- type: custom:aurora-background
  weather_entity: weather.home
  glass:
    enabled: true
    preset_entity: input_select.dashboard_style
  background:
    header: glass

# ---------------------------------------------------------------------------
# 10. Aurora Light – the minimum.
# ---------------------------------------------------------------------------
- type: custom:aurora-light
  entity: light.living_room

# ---------------------------------------------------------------------------
# 11. Aurora Light – all options.
# ---------------------------------------------------------------------------
- type: custom:aurora-light
  entity: light.desk
  name: Desk lamp
  icon: mdi:desk-lamp
  slider: true # false = plain toggle, no brightness drag
  use_light_color: true # false = neutral warm white instead of the bulb colour

# ---------------------------------------------------------------------------
# 12. Aurora Climate – the minimum.
# ---------------------------------------------------------------------------
- type: custom:aurora-climate
  entity: climate.living_room

# ---------------------------------------------------------------------------
# 13. Aurora Climate – compact: no mode row, buttons only.
# ---------------------------------------------------------------------------
- type: custom:aurora-climate
  entity: climate.bedroom
  name: Bedroom
  show_modes: false
  slider: false

# ---------------------------------------------------------------------------
# 14. Aurora Style – put any existing card into an Aurora surface.
#     Presets: glass | frosted | tinted | outline | plain
# ---------------------------------------------------------------------------
- type: custom:aurora-style
  style: glass
  card:
    type: entities
    entities:
      - light.living_room
      - sensor.temperature

# ---------------------------------------------------------------------------
# 15. Aurora Style – "plain" hands one card back to your theme, which is how
#     you exclude it from a dashboard-wide Aurora Glass.
# ---------------------------------------------------------------------------
- type: custom:aurora-style
  style: plain
  card:
    type: map
    entities:
      - device_tracker.phone

# ---------------------------------------------------------------------------
# 16. Aurora Style – preset plus overrides.
# ---------------------------------------------------------------------------
- type: custom:aurora-style
  style: frosted
  blur: 30
  opacity: 0.8
  glow: 0.2
  radius: 24
  border: false
  card:
    type: weather-forecast
    entity: weather.home

# ---------------------------------------------------------------------------
# 17. Aurora Layout – a phone is not a small desktop.
#     Each class may override the columns, the cards, and the gap.
# ---------------------------------------------------------------------------
- type: custom:aurora-layout
  gap: 12
  cards: # used by any class without its own set
    - type: custom:aurora-climate
      entity: climate.living_room
    - type: custom:aurora-light
      entity: light.living_room
  layouts:
    mobile:
      columns: 1
      cards: # the phone deliberately shows less
        - type: custom:aurora-climate
          entity: climate.living_room
    tablet:
      columns: 2
    desktop:
      columns: 3
    wide:
      columns: 4
      gap: 16

# ---------------------------------------------------------------------------
# 18. Aurora Layout – custom breakpoints, measured against the CARD's width,
#     not the viewport.
# ---------------------------------------------------------------------------
- type: custom:aurora-layout
  breakpoints:
    mobile: 700
    tablet: 1100
    desktop: 1800
  cards:
    - type: custom:aurora-light
      entity: light.living_room
    - type: custom:aurora-light
      entity: light.desk
