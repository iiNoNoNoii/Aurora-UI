name: Release

# Builds the bundle and attaches it to the GitHub release.
# HACS installs the release asset when one exists, so the file a user gets is
# always the exact artifact built from the tagged source.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync package version with the release tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          npm version "$TAG" --no-git-tag-version --allow-same-version

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Attach bundle to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/aurora-ui.js
