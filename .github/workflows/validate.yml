name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # HACS validation rules change over time – catch breakage before a release.
    - cron: '0 4 * * 1'

jobs:
  build:
    name: Type check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Fail if dist/ is out of date
        run: |
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/aurora-background.js is not in sync with src/."
            echo "Run 'npm run build' and commit the result."
            git --no-pager diff --stat -- dist/
            exit 1
          fi

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: plugin
